<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>你的命盘</title>
<style>
@font-face{font-family:'Zpix';src:url('__FONT_URL__') format('woff2');font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0E0B14}
body{font-family:'Zpix','MS Gothic',monospace;color:#C6BCE6;font-size:12px;line-height:1.9;
  -webkit-font-smoothing:none;padding:16px 12px 48px}
canvas{image-rendering:pixelated;display:block}
.wrap{max-width:680px;margin:0 auto}
h1{font-size:24px;color:#F2EDFF;line-height:1;letter-spacing:3px}
.panel{background:#171226;border:2px solid #443A6B;padding:12px}
.dim{color:#8579B0}.hi{color:#F2EDFF}.gold{color:#F5C542}
.sec{margin-top:16px}
.lab{color:#F5C542;letter-spacing:2px;margin-bottom:6px}

/* 1. 结果：命盘 */
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pil{border:2px solid;background:#0E0B14;text-align:center}
.pil .hd{background:#241C3D;color:#8579B0;padding:1px;line-height:1.4}
.pil .gz{font-size:24px;line-height:1.25;padding:5px 0}
.pil .ft{border-top:2px solid #443A6B;padding:1px;line-height:1.4}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.barRow{display:grid;grid-template-columns:16px 1fr 34px;gap:5px;align-items:center;margin-bottom:3px}
.bar{height:10px;background:#0E0B14;border:2px solid #443A6B}
.bar>i{display:block;height:100%}
.chips{display:flex;gap:3px;flex-wrap:wrap}
.chip{border:2px solid;padding:0 4px;line-height:1.6;background:#0E0B14}

/* 2. 舞台 */
.stage{border:2px solid #443A6B;background:#0E0B14;padding:0;overflow:hidden;position:relative}
.stage canvas{width:100%;height:auto}
.stageTag{position:absolute;left:6px;top:6px;color:#5A4E80;letter-spacing:1px}

/* 字幕 */
.caption{border:2px solid #443A6B;border-top:0;background:#171226;padding:10px 12px;
  color:#F2EDFF;min-height:40px;line-height:1.7}
.caption .via{float:right;color:#2E2745}

/* 3. 输入 */
.ask{display:flex;gap:6px;margin-top:8px}
.ask input{flex:1;background:#0E0B14;border:2px solid #443A6B;color:#F2EDFF;padding:8px;
  font-family:inherit;font-size:12px;outline:none}
.ask input:focus{border-color:#F5C542}
.ask button{background:#241C3D;border:2px solid #F5C542;color:#F5C542;padding:8px 14px;
  font-family:inherit;font-size:12px;cursor:pointer}
.ask button:active{background:#33285A}
.hints{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.hint{border:2px solid #33285A;padding:1px 6px;color:#8579B0;cursor:pointer;background:#0E0B14}
.hint:hover{border-color:#6B5CA5;color:#C6BCE6}

/* 输入页 */
#viewInput{max-width:420px;margin:8vh auto 0}
#viewInput h1{margin-bottom:4px}
.fRow{margin-top:14px}
.fRow label{display:block;color:#8579B0;margin-bottom:4px;letter-spacing:1px}
.fRow input,.fRow select{width:100%;background:#0E0B14;border:2px solid #443A6B;color:#F2EDFF;
  padding:9px;font-family:inherit;font-size:12px;outline:none}
.fRow input:focus,.fRow select:focus{border-color:#F5C542}
.fGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg2{display:flex;gap:0}
.seg2 span{flex:1;text-align:center;border:2px solid #443A6B;padding:9px 0;cursor:pointer;color:#8579B0}
.seg2 span+span{border-left:0}
.seg2 span.on{background:#33285A;color:#F5C542;border-color:#F5C542;position:relative;z-index:1}
.goBtn{width:100%;margin-top:22px;background:#241C3D;border:2px solid #F5C542;color:#F5C542;
  padding:12px;font-family:inherit;font-size:24px;letter-spacing:6px;cursor:pointer}
.goBtn:active{background:#33285A}
.demoLink{text-align:center;margin-top:12px;color:#5A4E80;cursor:pointer}
.demoLink:hover{color:#C6BCE6}
.stubNote{border:2px solid #443A6B;background:#171226;padding:12px;color:#8579B0;margin-top:8px}

/* 对话模式 */
.modeBar{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.modeBtn{border:2px solid #443A6B;background:#171226;color:#8579B0;padding:4px 10px;cursor:pointer;font-family:inherit;font-size:12px}
.modeBtn:hover{border-color:#F5C542;color:#F5C542}
.dlgBox{border:2px solid #F5C542;background:#171226;padding:14px 14px 22px;margin-top:8px;position:relative;cursor:pointer;min-height:120px}
.dlgTitle{color:#F5C542;letter-spacing:2px;margin-bottom:8px;font-size:24px;line-height:1.2}
.dlgKicker{color:#5A4E80;margin-bottom:8px}
.dlgText{color:#C6BCE6;white-space:pre-wrap}
.dlgText strong{color:#F2EDFF;font-weight:normal;border-bottom:2px solid #F5C542}
.dlgNext{position:absolute;right:10px;bottom:6px;color:#F5C542;animation:blink 1s steps(2,end) infinite}
.dlgProg{position:absolute;left:10px;bottom:6px;color:#5A4E80}
.dlgNav{display:flex;gap:6px;justify-content:space-between;margin-top:6px}
.dlgNav span{color:#5A4E80;cursor:pointer;border:2px solid #241C3D;padding:2px 8px}
.dlgNav span:hover{color:#C6BCE6;border-color:#443A6B}
@keyframes blink{50%{opacity:0}}

/* 4. 推断 */
.block{margin-top:18px}
.block h2{font-size:24px;color:#F5C542;line-height:1.2;letter-spacing:2px;margin-bottom:8px;
  border-bottom:2px solid #443A6B;padding-bottom:4px}
.block p{margin-bottom:12px;color:#C6BCE6}
.block p:last-child{margin-bottom:0}
.block strong{color:#F2EDFF;font-weight:normal;border-bottom:2px solid #F5C542}
.seg{border-left:4px solid #443A6B;padding-left:10px;margin-bottom:14px}
.seg .age{color:#F5C542}
.seg .pl{color:#5A4E80;margin-left:6px}
.one{border:2px solid #F5C542;background:#1C1526;padding:16px;text-align:center;
  font-size:24px;line-height:1.6;color:#F2EDFF}

/* 术语（issue #1） */
.term{border-bottom:2px dotted #6B5CA5;cursor:help}
.term:hover{color:#F2EDFF;border-bottom-color:#F5C542}
#termPop{display:none;position:absolute;z-index:99;max-width:300px;background:#241C3D;
  border:2px solid #F5C542;padding:10px 12px;color:#C6BCE6;line-height:1.8;
  font-family:'Zpix','MS Gothic',monospace;font-size:12px}
#termPop b{color:#F5C542}

/* 可读性（issue #2）：A+ 放大档 + 层级微调 */
body.big{zoom:1.5}
.pil .hd,.pil .ft{padding:3px 1px}
.chip{padding:2px 6px;line-height:1.9}
.foot{color:#6F639B}
.hints{gap:6px}
.hint{padding:6px 10px}
.dlgNav span{padding:8px 12px}
input[type=range]::-webkit-slider-thumb{width:18px;height:22px}

/* 可点性区分（issue #3） */
button,.hint,.node,.modeBtn,.dlgNav span,.term{cursor:pointer}
.hint:active,.modeBtn:active,.dlgNav span:active{background:#33285A;color:#F5C542}
.node:hover .dot{border-color:#F5C542!important}
button:focus-visible,input:focus-visible,select:focus-visible,.hint:focus-visible,
.dlgNav span:focus-visible,.modeBtn:focus-visible{outline:3px solid #F5C542;outline-offset:2px}
.one{border-color:#6B5CA5}                     /* 静态强调卡不再用金边（金=可点） */
.askLab{color:#F5C542;letter-spacing:2px;margin-top:14px}
.dlgBox:hover{background:#1C1630}

/* 生成 */
.genWrap{border:2px solid #F5C542;background:#1C1526;padding:14px;margin-top:14px;text-align:center}
.genWrap .goBtn{margin-top:0}
.genWrap .dim{margin-top:8px}
.dlLink{color:#5CE1C4;cursor:pointer;margin-left:10px}

/* 5. 时间轴 */
.map{display:flex;align-items:center;overflow-x:auto;padding:6px 0}
.node{flex:0 0 auto;width:52px;text-align:center;cursor:pointer}
.node .dot{width:24px;height:24px;margin:0 auto;border:2px solid;background:#0E0B14;
  display:flex;align-items:center;justify-content:center;color:#F2EDFF}
.node.cur .dot{box-shadow:0 0 0 3px #F5C542}
.link{flex:0 0 auto;width:10px;height:2px;background:#443A6B}
input[type=range]{-webkit-appearance:none;width:100%;height:14px;background:#0E0B14;border:2px solid #443A6B}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:18px;background:#F5C542;border:2px solid #0E0B14;cursor:pointer}

.foot{color:#5A4E80;margin-top:24px;border-top:2px solid #241C3D;padding-top:10px;line-height:1.7}
.devBtn{float:right;color:#2E2745;cursor:pointer;font-size:12px}
.devBtn:hover{color:#8579B0}
#dev{display:none;margin-top:12px}
#dev.on{display:block}
</style>
</head>

<script>
/* issue #1: 术语词典 —— 首次出现的术语加虚线，点一下出白话解释 */
const GLOSS={
 '八字':'你出生的年、月、日、时各用两个字表示，一共八个字。这套分析全部从这八个字推出来。',
 '四柱':'年、月、日、时四组干支，每组一柱。不同柱管人生不同侧面。',
 '天干':'每柱上面那个字（甲乙丙丁…）。表示外在、显性的力量。',
 '地支':'每柱下面那个字（子丑寅卯…）。表示内在、隐性的力量。',
 '日主':'你出生那天的天干，代表「你自己」。整张盘都以它为中心来看。',
 '日柱':'出生那天的干支。上面是你自己，下面是配偶宫。',
 '五行':'金木水火土五种能量。盘里各占多少，决定你天生的配置。',
 '身强':'帮你的能量多。不等于命好，是「配置偏向自足」。',
 '身弱':'帮你的能量少。不等于命差，是「配置偏向借力」。',
 '用神':'这张盘最需要补的那种能量。后面的建议多半围着它转。',
 '藏干':'每个地支里还藏着一到三个天干，像口袋里的暗牌。细看盘就是把它们翻出来。',
 '本气':'地支里藏的几个天干中力量最大的那个。',
 '纳音':'每柱干支组合出的一个意象（比如大海水、山头火），描述这根柱子的质地。',
 '十神':'盘里其他字和你（日主）的十种关系，各管一类人事（钱、权、表达、庇护…）。',
 '正官':'十神之一：规矩和名分。管上司、体制，女命也代表丈夫。',
 '七杀':'十神之一：强压力和魄力。管严厉的上级、挑战，是把双刃剑。',
 '正印':'十神之一：庇护和吸收。管母亲、老师、学习，多了容易被照顾得不想动。',
 '偏印':'十神之一：偏门的庇护。管非主流的学问和长辈，带点疏离。',
 '正财':'十神之一：稳定的钱。男命也代表妻子。',
 '偏财':'十神之一：流动的钱和机会。也代表父亲。',
 '食神':'十神之一：温和的输出。管才艺、口福、产出。',
 '伤官':'十神之一：锋利的输出。管表达、作品、不服管。',
 '比肩':'十神之一：和你同类的人。兄弟姐妹、朋友、合作者。',
 '劫财':'十神之一：同类但会分走你东西的人。竞争者，也是感情里「第三方」的位置。',
 '冲':'两个地支正面相撞，对应的领域容易动荡、变化。',
 '合':'两个地支互相吸引绑定，对应领域容易黏连、牵制。',
 '刑':'地支之间互相消耗的关系，多为内部摩擦。',
 '自刑':'同一个字出现两次自己跟自己较劲，典型表现是内耗。',
 '害':'地支之间暗中妨碍的关系，比冲隐蔽。',
 '大运':'从起运开始，每十年换一个大环境，像游戏换关卡。',
 '流年':'每一年的运，叠加在大运之上。',
 '起运':'你的大运系统开始运转的岁数，由出生时刻到节气的距离算出。',
 '宫位':'四柱各管一类人：年柱父母、月柱兄弟、日支配偶、时柱子女。',
 '配偶宫':'日柱下面那个字的位置，看亲密关系的模式。',
 '父母宫':'年柱的位置，看出身和父母给你的底色。',
 '十二长生':'把一个天干在十二个地支上的状态比作人的一生（长生、帝旺、死、墓…），描述它在那个位置有没有劲。',
 '帝旺':'十二长生里最有劲的状态。',
 '长生':'十二长生里刚起势的状态。',
 '神煞':'盘上的特殊标记，像游戏里的 buff/debuff（桃花、驿马、贵人都是）。',
 '调候':'按出生季节冷暖来补：冬天生的先补火，夏天生的先补水。',
 '透干':'地支里藏的字也出现在天干上，暗牌变明牌，力量放大。',
 '通根':'天干在地支里有同类接应，像树扎了根。',
};
const GLOSS_RE=new RegExp('('+Object.keys(GLOSS).sort((a,b)=>b.length-a.length).join('|')+')','g');
function annotate(html,seen){
  seen=seen||new Set();
  return html.split(/(<[^>]+>)/).map(seg=>seg.startsWith('<')?seg:seg.replace(GLOSS_RE,m=>{
    if(seen.has(m))return m; seen.add(m);
    return '<span class="term" data-t="'+m+'">'+m+'</span>';
  })).join('');
}
document.addEventListener('click',e=>{
  const pop=document.querySelector('#termPop');
  if(e.target.classList&&e.target.classList.contains('term')){
    const t=e.target.dataset.t;
    pop.innerHTML='<b>'+t+'</b>　'+GLOSS[t];
    pop.style.display='block';
    const r=e.target.getBoundingClientRect();
    pop.style.left=Math.min(window.innerWidth-pop.offsetWidth-10,Math.max(8,r.left))+'px';
    pop.style.top=(r.bottom+window.scrollY+6)+'px';
  } else if(pop) pop.style.display='none';
});
</script>

          +'（同党 '+chart.wangShuai.allyPercent+'%）。\n\n宫位：'
          +PK.map(p=>chart.palaces.byPillar[p].label+'柱'+chart.palaces.byPillar[p].ganZhi+'＝'+chart.palaces.byPillar[p].palace).join('，')
          +'。\n\n'+chart.qiYun.text+'，第一步大运 '+(dy[0]?dy[0].ganZhi+'（'+dy[0].startYear+' 年起）':'—')+'。',
         anim:{caption:'绕着你转的点就是你的五行——'+maxW+'色的最多，'+minW+'最少。',duration:14,backdrop:'ground',
               actors:[{sprite:'orbit',behavior:'wuxing'},{sprite:'hero',behavior:'idle'}]}},
        {id:'oneline',title:'说明',scene:'self',
         text:'上面的盘、五行、十神、神煞、大运时间轴都是照你的生辰实算的；下面的提问也会按你的盘回答。完整的长文命书要跑一遍解读流水线（V1–V6 + 文风层），这个演示页还没接——想看完整效果，回开头点「演示盘」。'}
      ]
    };
  }
  function boot(chart,final){
    $('#viewInput').style.display='none';
    $('#viewReading').style.display='';
    initReading(chart,final);
  }
  $('#fGo').onclick=()=>{
    const d=$('#fDate').value, t=$('#fTime').value;
    if(!d||!t){alert('生日和时刻都要填');return}
    const [y,m,dd]=d.split('-').map(Number), [h,mi]=t.split(':').map(Number);
    const chart=Engine.paipan({year:y,month:m,day:dd,hour:h,minute:mi,gender,
      city:sel.value||undefined,province:prov.value||undefined});
    const isDemo=chart.bazi===DEMO_CHART.bazi&&gender==='male';
    boot(chart,isDemo?DEMO_FINAL:stubFinal(chart));
  };
  $('#fDemo').onclick=()=>boot(DEMO_CHART,DEMO_FINAL);
})();

function initReading(CHART,FINAL){
let F=FINAL, CUR_PROCESS=(FINAL.stub?null:PROCESS), FLOW=[];

/* 头 */
$('#bazi').textContent=CHART.bazi;
$('#who').textContent=F.who+'　·　真太阳时 '+CHART.time.trueSolarTime;
$('#foot').innerHTML=F.disclaimer;

/* ① 命盘 */
$('#pillars').innerHTML=PK.map(p=>{
  const v=CHART.pillars[p],c=DS.wuXing[v.ganWuXing],
        ss=v.shiShenGan==='日主'?DS.base.gold:DS.colorOfShiShen(v.shiShenGan),
        pa=CHART.palaces.byPillar[p];
  return `<div class="pil" style="border-color:${c.dark}">
    <div class="hd">${pa.palace}</div>
    <div class="gz" style="color:${c.base}">${v.gan}<br>${v.zhi}</div>
    <div class="ft" style="color:${ss}">${v.shiShenGan}</div>
    <div class="hd" style="border-top:2px solid #443A6B">${pa.ageFrom}–${pa.ageTo??''}</div></div>`;
}).join('');

$('#bars').innerHTML=Object.entries(CHART.wuXing.percent).map(([k,v])=>{
  const c=DS.wuXing[k];
  return `<div class="barRow"><span style="color:${c.base}">${k}</span>
    <div class="bar"><i style="width:${Math.min(100,v*2.2)}%;background:${c.base};border-right:2px solid ${c.light}"></i></div>
    <span class="dim" style="text-align:right">${v}%</span></div>`;
}).join('');

$('#ss').innerHTML=Object.entries(CHART.shiShenCount).sort((a,b)=>b[1]-a[1]).map(([s,n])=>{
  const c=DS.colorOfShiShen(s);
  return `<span class="chip" style="border-color:${c};color:${c}">${s}<span class="dim"> ${n}</span></span>`;
}).join('');

const seen=new Set();
$('#buffs').innerHTML=CHART.shenSha.filter(s=>{if(seen.has(s.name))return false;seen.add(s.name);return true})
  .map(s=>{const d=DS.shenSha[s.name];if(!d)return '';const c=DS.toneColor[d.tone];
    return `<span class="chip" style="border-color:${c};color:${c}" title="${s.name}">${d.label}</span>`}).join('');

/* ② 舞台 —— 一切都走脚本：预生成的（final.blocks[].anim）或 LLM 实时生成的 */
const stage=Stage.mount($('#stage'),CHART,{scale:6});
const DCTX={chart:CHART,get final(){return F},route:Stage.route,validate:Stage.validateScript};
function playScript(sc,via){
  try{ stage.playScript(sc); }catch(e){ console.warn(e); stage.play('unknown'); }
  $('#capText').textContent=sc.caption||'';
  $('#capVia').textContent=via==='api'?'· 实时生成':'';
  $('#stageTag').textContent='';
}
function playBlock(id){
  const b=F.blocks.find(x=>x.id===id);
  if(b&&b.anim) playScript(b.anim,'prebaked');
}

/* ③ 提问 —— 有 window.BAZI_API 就实时调 LLM 生成脚本，否则回退预生成 */
async function ask(){
  const q=$('#q').value.trim(); if(!q) return;
  $('#capText').textContent='……';
  const r=await Director.ask(q,DCTX);
  playScript(r.script,r.via);
}
$('#go').onclick=ask;
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
const HINTS=['我的感情怎么样','钱的方面呢','工作适合什么','身体要注意什么','跟父母的关系','未来几年'];
$('#hints').innerHTML=HINTS.map(h=>`<span class="hint">${h}</span>`).join('');
$('#hints').querySelectorAll('.hint').forEach(n=>n.onclick=()=>{$('#q').value=n.textContent;ask()});

/* ④ 推断 */
const para=(t,seen)=>t.split('\n\n').map(x=>`<p>${annotate(x.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'),seen)}</p>`).join('');
const obs=new IntersectionObserver(es=>{
  if(mode!=='full')return;
  for(const e of es) if(e.isIntersecting&&e.target.dataset.block) playBlock(e.target.dataset.block);
},{rootMargin:'-40% 0px -40% 0px'});
function renderFinal(){
  $('#who').textContent=F.who+'　·　真太阳时 '+CHART.time.trueSolarTime;
  $('#reading').innerHTML=F.blocks.map(b=>{
    if(b.id==='oneline') return `<div class="block"><div class="one">${b.text}</div></div>`;
    const seen=new Set();
    let h=`<div class="block" data-block="${b.id}"><h2>${b.title}</h2>`;
    if(b.text) h+=para(b.text,seen);
    if(b.segments) h+=b.segments.map(s=>`<div class="seg"><div><span class="age">${s.age}</span><span class="pl">${s.pillar}</span></div>${para(s.text,seen)}</div>`).join('');
    return h+'</div>';
  }).join('');
  $('#genArea').innerHTML=(F.stub&&window.BAZI_API)?`<div class="genWrap"><button class="goBtn" id="genFull">生成完整命书</button>
    <div class="dim">V1→V6 六层推演 + 成文，约 2–3 分钟 · 生成过程会在上面的画面框直播</div></div>`:'';
  document.querySelectorAll('.block[data-block]').forEach(n=>obs.observe(n));
  const g=$('#genFull'); if(g) g.onclick=genFull;
  buildFlow(); showPara(0,true);
  playBlock('open');
}

/* ⑤ 时间轴 */
const DY=CHART.daYun.filter(d=>d.gan);
function renderMap(y){
  const m=$('#map');m.innerHTML='';
  DY.forEach((d,i)=>{
    if(i)m.insertAdjacentHTML('beforeend','<div class="link"></div>');
    const c=DS.wuXing[d.ganWuXing],cs=DS.changSheng[d.changSheng]||{level:2,label:d.changSheng};
    const cur=y>=d.startYear&&y<=d.endYear;
    const n=document.createElement('div');n.className='node'+(cur?' cur':'');
    n.innerHTML=`<div class="dot" style="border-color:${c.base};opacity:${[.3,.5,.7,.85,1][cs.level]}">${d.gan}</div>
      <div style="color:${c.base}">${d.ganZhi}</div><div class="dim">${cs.label}</div>`;
    n.onclick=()=>{$('#slider').value=d.startYear;onYear(d.startYear)};
    m.appendChild(n);
  });
}
function onYear(y){
  $('#yNow').textContent=y; renderMap(y);
  const d=DY.find(x=>y>=x.startYear&&y<=x.endYear);
  const ln=d&&d.liuNian.find(l=>l.year===+y);
  $('#yInfo').innerHTML=d?`大运 <span class="hi">${d.ganZhi}</span>　流年 <span class="hi">${ln?ln.ganZhi:'—'}</span>　${ln?ln.age+' 岁':''}`:'起运前';
  playBlock('path');
}
const yA=DY[0].startYear,yB=DY[DY.length-1].endYear;
Object.assign($('#slider'),{min:yA,max:yB,value:2026});
$('#y0').textContent=yA;$('#y1').textContent=yB;
$('#slider').oninput=e=>onYear(+e.target.value);
$('#yNow').textContent=2026;renderMap(2026);
const d0=DY.find(x=>2026>=x.startYear&&x.endYear>=2026),l0=d0&&d0.liuNian.find(l=>l.year===2026);
$('#yInfo').innerHTML=d0?`大运 <span class="hi">${d0.ganZhi}</span>　流年 <span class="hi">${l0?l0.ganZhi:'—'}</span>　${l0?l0.age+' 岁':''}`:'';

/* 对话模式 —— 一段一段讲，正在打字时点一下=立刻显示全段，打完点一下=下一段 */
function buildFlow(){
  FLOW=[];
  F.blocks.forEach(b=>{
    const paras=[];
    if(b.text) b.text.split('\n\n').forEach(t=>paras.push({t}));
    if(b.segments) b.segments.forEach(sg=>sg.text.split('\n\n').forEach((t,i)=>paras.push({t,kick:i===0?sg.age+'　'+sg.pillar:null})));
    paras.forEach((p,i)=>FLOW.push({block:b.id,title:b.title,first:i===0,gold:b.id==='oneline',...p}));
  });
  fi=0;
}
let fi=0,typing=null,mode='dlg';
const fmt=t=>t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
function showPara(i,instant){
  fi=Math.max(0,Math.min(FLOW.length-1,i));
  const f=FLOW[fi];
  $('#dlgTitle').textContent=f.title;
  $('#dlgKicker').textContent=f.kick||'';
  $('#dlgKicker').style.display=f.kick?'':'none';
  $('#dlgProg').textContent=(fi+1)+' / '+FLOW.length;
  $('#dlgText').style.color=f.gold?'#F2EDFF':'';
  if(f.first) playBlock(f.block);
  updateNav();
  if(typing){clearInterval(typing);typing=null}
  if(instant){$('#dlgText').innerHTML=annotate(fmt(f.t),new Set());updateNav();$('#dlgNext').textContent='▼';return}
  let n=0;const chars=[...f.t];
  $('#dlgText').innerHTML='';$('#dlgNext').textContent='…';
  typing=setInterval(()=>{
    n+=2;
    $('#dlgText').innerHTML=fmt(chars.slice(0,n).join(''));
    if(n>=chars.length){clearInterval(typing);typing=null;$('#dlgText').innerHTML=annotate(fmt(f.t),new Set());$('#dlgNext').textContent='▼'}
  },50);
}
$('#dlgBox').onclick=()=>{ if(typing){showPara(fi,true)} else if(fi<FLOW.length-1){showPara(fi+1)} };
function updateNav(){
  const cur=FLOW[fi]&&FLOW[fi].title, pv=FLOW[fi-1], nx=FLOW[fi+1];
  $('#navPrev').textContent=pv?(pv.title!==cur?'← 上一章·'+pv.title:'← 上一段'):'← 开头';
  $('#navNext').textContent=nx?(nx.title!==cur?'下一章·'+nx.title+' →':'下一段 →'):'完 ·';
}
$('#navPrev').onclick=e=>{e.stopPropagation();showPara(fi-1,true)};
$('#navNext').onclick=e=>{e.stopPropagation();if(fi<FLOW.length-1)showPara(fi+1)};
document.addEventListener('keydown',e=>{if(mode!=='dlg')return;if(e.key===' '||e.key==='Enter'){if(e.target.tagName!=='INPUT'){e.preventDefault();$('#dlgBox').click()}}});
$('#bigBtn').onclick=()=>{
  document.body.classList.toggle('big');
  $('#bigBtn').textContent=document.body.classList.contains('big')?'A⁻':'A⁺';
};
$('#modeBtn').onclick=()=>{
  mode=mode==='dlg'?'full':'dlg';
  $('#dlgBox').style.display=mode==='dlg'?'':'none';
  $('#dlgNav').style.display=mode==='dlg'?'':'none';
  $('#reading').style.display=mode==='dlg'?'none':'';
  $('#modeBtn').textContent=mode==='dlg'?'整页阅读':'一段一段看';
};
renderFinal();

/* 开发者视图（仅演示盘有推理过程） */
$('#devBtn').onclick=()=>{
  if(!CUR_PROCESS)return;
  const d=$('#dev');d.classList.toggle('on');
  d.innerHTML='<div class="panel"><div class="lab">内部推理过程（不对用户展示）</div>'+
    CUR_PROCESS.map(v=>`<div style="margin-top:10px;border-top:2px solid #241C3D;padding-top:8px">
      <div class="gold">${v.version} · ${v.title}</div>
      <div class="dim">解锁：${v.unlockedDimensions.join(' / ')}</div>
      ${(v.diff||[]).map(x=>`<div style="margin-top:6px"><span class="dim">${x.path}</span><br>
        <span style="color:#8579B0;text-decoration:line-through">${x.from}</span><br>
        <span class="hi">→ ${x.to}</span><br><span style="color:#5CE1C4">${x.trigger} · ${x.why}</span></div>`).join('')}
      ${(v.conflicts||[]).map(c=>`<div style="margin-top:6px;color:#FF5C6E">冲突 ${c.between.join(' ↔ ')}：${c.issue}<br>
        <span style="color:#5CE1C4">${c.resolution}</span></div>`).join('')}
    </div>`).join('')+'</div>';
};
/* ═══ 完整命书流水线 ═══ */
function buildAnims(chart){
  const hourFrom=Math.round(chart.palaces.byPillar.hour.ageFrom);
  return {
    open:{duration:14,backdrop:'ground',actors:[{sprite:'orbit',behavior:'wuxing'},{sprite:'hero',behavior:'idle'},{sprite:'flame',behavior:'blink',x:78,y:32}]},
    who:{duration:14,backdrop:'ground',actors:[{sprite:'lid',x:44,y:8,w:32},{sprite:'bubbles',behavior:'rise',x:54,count:5,ceiling:12},{sprite:'hero',behavior:'idle'}]},
    family:{duration:12,backdrop:'ground',actors:[{sprite:'wall',x:10},{sprite:'wall',x:100},{sprite:'hero',behavior:'idle'}]},
    peers:{duration:14,backdrop:'ground',actors:[{sprite:'ghost',x:6},{sprite:'ghost',x:98},{sprite:'hero',behavior:'idle'},{sprite:'coin',behavior:'drift',from:[52,32],to:[12,26]}]},
    love:{duration:16,backdrop:'ground',actors:[{sprite:'umbrella',x:30,y:1},{sprite:'ghost',x:60},{sprite:'hero',behavior:'idle',x:24},{sprite:'rival',behavior:'approach',range:[78,102]},{sprite:'crack',x:26,len:24}]},
    path:{duration:16,backdrop:'none',actors:[{sprite:'tiles'},{sprite:'hero',behavior:'walk',range:[4,112],speed:1}]},
    money:{duration:15,backdrop:'ground',actors:[{sprite:'coin',behavior:'fall',x:8,count:6,period:17},{sprite:'basket',x:96},{sprite:'hero',behavior:'idle',x:16}]},
    career:{duration:16,backdrop:'ground',actors:[{sprite:'torch',behavior:'off',x:8},{sprite:'torch',behavior:'off',x:31},{sprite:'torch',behavior:'off',x:54},{sprite:'torch',behavior:'flicker',x:77},{sprite:'torch',behavior:'lit',x:100},{sprite:'hero',behavior:'walk',range:[2,100],speed:1}]},
    body:{duration:15,backdrop:'rain',actors:[{sprite:'hero',behavior:'curl'},{sprite:'flame',behavior:'blink',x:56,y:32}]},
    oneline:{duration:12,backdrop:'ground',actors:[{sprite:'hero',behavior:'cheer'},{sprite:'flame',behavior:'steady',x:78,y:30}]},
  };
}

async function genFull(){
  const btn=$('#genFull'); btn.disabled=true; btn.textContent='推演中…';
  const url=window.BAZI_API.replace(/\/+$/,'')+'/reading';
  const CHART=DCTX.chart;
  const stepScene={V1:'self',V2:'family',V3:'love',V4:'self',V5:'peers',V6:'future',voiceA:'express',voiceB:'career'};
  const stepName={V1:'V1 身强弱·五行',V2:'V2 宫位',V3:'V3 藏干·坐支',V4:'V4 纳音',V5:'V5 十神',V6:'V6 神煞',voiceA:'成文 · 上半',voiceB:'成文 · 下半'};
  const post=async b=>{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
    const j=await r.json();
    if(!r.ok||j.error) throw new Error(j.error||('HTTP '+r.status));
    return j;
  };
  try{
    let prev=null; const vsteps=[],diffs=[];
    const order=['V1','V2','V3','V4','V5','V6','voiceA','voiceB'];
    const blocks={};
    for(let i=0;i<order.length;i++){
      const st=order[i];
      stage.play(stepScene[st]);
      $('#capText').textContent='推演中 '+(i+1)+'/8 · '+stepName[st]+'……';
      $('#capVia').textContent='';
      btn.textContent='推演中 '+(i+1)+'/8';
      const body=/^V/.test(st)?{step:st,chart:CHART,prev}:{step:st,chart:CHART,r6:prev,diffs:diffs.slice(0,14)};
      const j=await post(body);
      if(/^V/.test(st)){
        prev=j.result.reading; vsteps.push(j.result);
        for(const d of (j.result.diff||[])) diffs.push({v:st,...d});
      } else for(const b of j.result.blocks) blocks[b.id]=b;
    }
    const anims=buildAnims(CHART);
    const ORDER=['open','who','family','peers','love','path','money','career','body','oneline'];
    const newBlocks=ORDER.filter(id=>blocks[id]).map(id=>{
      const b=blocks[id], anim=anims[id];
      if(anim){anim.caption=b.caption||(b.text||'').split('\n')[0].slice(0,48);}
      return {...b,anim};
    });
    F={chart:CHART.bazi,who:F.who,disclaimer:'以上为娱乐性质的传统命理解读，不构成任何专业建议。',blocks:newBlocks};
    CUR_PROCESS=vsteps.map((v,i)=>({version:'V'+(i+1),title:['身强弱·五行','宫位','藏干·坐支','纳音','十神','神煞'][i],
      unlockedDimensions:[],diff:v.diff||[],conflicts:v.conflicts||[]}));
    renderFinal();
    // 归档到服务端（盘+命书+推理过程，失败不影响使用）
    fetch(url.replace(/\/reading$/,'/save'),{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chart:CHART,blocks:newBlocks.map(({anim,...b})=>b),process:vsteps,model:'deepseek-v4-flash'})})
      .catch(()=>{});
    // 下载链接
    if(!$('#dlFinal')){
      const a=document.createElement('span');a.id='dlFinal';a.className='dlLink';a.textContent='↓ 保存命书';
      a.onclick=()=>{const bl=new Blob([JSON.stringify(F,null,2)],{type:'application/json'});
        const u=URL.createObjectURL(bl);const l=document.createElement('a');l.href=u;l.download='mingshu-'+CHART.bazi.replace(/\s/g,'')+'.json';l.click();};
      $('.modeBar').appendChild(a);
    }
    $('#capText').textContent='命书生成完毕。往下读，或点画面下方的问框提问。';
  }catch(e){
    alert('第'+(($('#capText').textContent.match(/(\d)\/8/)||[])[1]||'?')+'步失败：'+e.message+'\n可以再点一次按钮重试。');
    btn.disabled=false;btn.textContent='生成完整命书（重试）';
  }
}
} /* end initReading */
</script>
